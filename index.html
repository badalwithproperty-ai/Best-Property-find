
<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROPERTY FIND CRM</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7f4;color:#17251f;font:16px system-ui,Arial}
header{background:#123c32;color:white;padding:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:3px solid #d6b36a}
.wrap{max-width:1200px;margin:auto;padding:18px}
.card,.panel,.stat{background:white;border:1px solid #dce5df;border-radius:14px;padding:18px;margin:10px 0}
button{border:0;border-radius:9px;padding:10px 14px;background:#1d6a52;color:white;font-weight:650;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.secondary{background:#e7eee9;color:#123c32}
.danger{background:#fff0ee;color:#b42318}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd8d0;border-radius:8px;font:inherit}
.field{margin:12px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.hidden{display:none!important}
.msg{padding:10px;background:#edf4f0;border-radius:8px;margin-top:10px;overflow-wrap:anywhere;white-space:pre-wrap}
.err{background:#fff0ee;color:#b42318}
.tabs,.actions{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{margin:0}
.stat small{display:block;color:#64736c}
.stat strong{font-size:25px}
.tablewrap{overflow:auto;background:white;border:1px solid #dce5df;border-radius:10px;margin:10px 0}
table{border-collapse:collapse;width:100%;min-width:650px}
td,th{text-align:left;padding:11px;border-bottom:1px solid #e5ece7}
th{background:#eef4f0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.modalback{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}
.modal{background:white;border-radius:14px;padding:18px;width:min(750px,100%);max-height:90vh;overflow:auto}
.muted{color:#64736c;font-size:13px}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.small{padding:7px 10px;font-size:13px}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#e7eee9;font-size:12px}
.overdue{color:#b42318;font-weight:700}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<header>
  <div><b>PROPERTY FIND</b>
    <div style="font-size:12px;color:#d7e7df">Real Estate CRM · Leads · Follow-ups · Reports</div>
  </div>
  <div><span id="status">Connecting...</span>
    <button id="out" class="secondary hidden" onclick="logout()">Sign out</button>
  </div>
</header>

<section id="auth" class="wrap" style="max-width:480px">
  <div class="card">
    <h2 id="authTitle">Login to PROPERTY FIND</h2>
    <p class="muted">Email और password से login करें।</p>
    <form id="authForm">
      <div id="nameWrap" class="field hidden"><label>Full name</label><input id="fullName" autocomplete="name"></div>
      <div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div>
      <div class="field"><label>Password</label><input id="password" type="password" minlength="6" required autocomplete="current-password"></div>
      <div class="actions">
        <button id="submit" type="submit">Login</button>
        <button type="button" class="secondary" id="modeBtn" onclick="toggleMode()">Create account</button>
      </div>
    </form>
    <button type="button" class="secondary" id="resetBtn" onclick="resetPass()">Forgot password?</button>
    <div id="msg" class="msg hidden" role="status" aria-live="polite"></div>
  </div>
</section>

<main id="app" class="wrap hidden">
  <h1 id="welcome">Dashboard</h1>
  <div class="tabs">
    <button onclick="goPage('dashboard')">Dashboard</button>
    <button onclick="goPage('customers')">Customers & Leads</button>
    <button onclick="goPage('inventory')">Inventory</button>
    <button onclick="goPage('associates')">Associates</button>
    <button onclick="goPage('activities')">Calls & Activities</button>
    <button onclick="goPage('followups')">Follow-up Reminders</button>
    <button onclick="goPage('reports')">Sales Reports</button>
    <button onclick="goPage('team')">Team Performance</button>
    <button onclick="goPage('backup')">Backup</button>
  </div>
  <div id="content"></div>
</main>
<div id="modal"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';

const SUPABASE_URL='https://gevdyoshdxquxxavchyb.supabase.co';
const SUPABASE_KEY='sb_publishable_aog87IoJg5GAglWENwNK8A_cpT1dXtt';

let sb=null,user=null,mode='login',page='dashboard';
let authBusy=false,loading=false,saveBusy=false;
let db={customers:[],inventory:[],associates:[],activities:[]};

const $=id=>document.getElementById(id);
const STATUSES=['New','Contacted','Interested','Follow-up','Converted','Lost'];

function escapeHTML(value){
 return String(value??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}
function message(text,isError=false){
 const box=$('msg');box.textContent=text;
 box.classList.remove('hidden','err');
 if(isError)box.classList.add('err');
}
function hideMessage(){$('msg').classList.add('hidden')}
function setStatus(text){$('status').textContent=text}
function goPage(p){page=p;render()}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){return d?escapeHTML(d):'—'}
function normStatus(s){return STATUSES.includes(s)?s:'New'}

function toggleMode(){
 if(authBusy)return;
 mode=mode==='login'?'signup':'login';
 $('authTitle').textContent=mode==='login'?'Login to PROPERTY FIND':'Create account';
 $('submit').textContent=mode==='login'?'Login':'Create account';
 $('modeBtn').textContent=mode==='login'?'Create account':'Back to Login';
 $('nameWrap').classList.toggle('hidden',mode==='login');
 $('fullName').required=mode==='signup';
 $('password').autocomplete=mode==='login'?'current-password':'new-password';
 hideMessage();
}

async function init(){
 if(!window.supabase){setStatus('Library error');return}
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
 });
 setStatus('Checking session...');
 const {data,error}=await sb.auth.getSession();
 if(error){setStatus('Session error');message(error.message,true);return}
 if(data.session)await load(data.session.user);else showLogin();
 sb.auth.onAuthStateChange((event,session)=>{
  setTimeout(()=>{
   if(session){
    if(user&&user.id===session.user.id&&!$('app').classList.contains('hidden'))return;
    load(session.user);
   }else showLogin();
  },0);
 });
}

$('authForm').addEventListener('submit',async e=>{
 e.preventDefault();if(authBusy)return;
 if(!sb){message('Connection तैयार नहीं है। Refresh करें।',true);return}
 authBusy=true;$('submit').disabled=true;
 try{
  const email=$('email').value.trim(),password=$('password').value;
  let result;
  if(mode==='signup'){
   result=await sb.auth.signUp({email,password,options:{data:{full_name:$('fullName').value.trim()}}});
  }else result=await sb.auth.signInWithPassword({email,password});
  if(result.error)throw result.error;
  if(mode==='signup'&&!result.data.session){
   message('Signup request पूरी हुई। Email confirmation करके Login करें।');
  }else if(result.data.session){
   await load(result.data.session.user);
  }
 }catch(err){message('Authentication error: '+err.message,true)}
 finally{
  authBusy=false;$('submit').disabled=false;
 }
});

async function resetPass(){
 if(!sb)return;
 const email=$('email').value.trim();
 if(!email){message('पहले email भरें।',true);return}
 try{
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  if(error)throw error;
  message('यदि इस email का account है, तो reset link भेज दिया जाएगा।');
 }catch(err){message(err.message,true)}
}
function showLogin(){
 user=null;loading=false;
 $('app').classList.add('hidden');$('auth').classList.remove('hidden');
 $('out').classList.add('hidden');setStatus('Not signed in');
}
async function logout(){
 if(!sb)return;
 const {error}=await sb.auth.signOut();
 if(error){alert(error.message);return}
 showLogin();
}

async function load(authUser){
 if(!sb||!authUser||loading)return;
 loading=true;user=authUser;setStatus('Connecting to cloud...');
 try{
  const {data:row,error}=await sb.from('workspace_state')
   .select('data').eq('owner_id',authUser.id).maybeSingle();
  if(error)throw error;
  const saved=row?.data||{};
  db={
   customers:Array.isArray(saved.customers)?saved.customers:[],
   inventory:Array.isArray(saved.inventory)?saved.inventory:[],
   associates:Array.isArray(saved.associates)?saved.associates:[],
   activities:Array.isArray(saved.activities)?saved.activities:[]
  };
  // पुराने records को पढ़ते समय नए fields की जरूरत नहीं होती।
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');
  $('out').classList.remove('hidden');
  $('welcome').textContent='Workspace · '+(authUser.email||'');
  setStatus('Cloud connected');render();
 }catch(err){
  user=null;setStatus('Database error');
  $('app').classList.add('hidden');$('auth').classList.remove('hidden');
  $('out').classList.add('hidden');
  message('Cloud database error: '+err.message,true);
 }finally{loading=false}
}

async function save(){
 if(!user||!sb){alert('पहले Login करें।');return false}
 if(saveBusy){alert('Save चल रहा है, एक क्षण रुकें।');return false}
 saveBusy=true;setStatus('Saving to cloud...');
 try{
  const {error}=await sb.from('workspace_state').upsert({
   owner_id:user.id,data:db,updated_at:new Date().toISOString()
  },{onConflict:'owner_id'});
  if(error)throw error;
  setStatus('Cloud synced');render();return true;
 }catch(err){setStatus('Save failed');alert('Cloud save failed: '+err.message);return false}
 finally{saveBusy=false}
}

function tbl(headers,rows){
 return '<div class="tablewrap"><table><thead><tr>'+
 headers.map(x=>'<th>'+escapeHTML(x)+'</th>').join('')+
 '</tr></thead><tbody>'+(rows||'<tr><td colspan="'+headers.length+'">अभी कोई रिकॉर्ड नहीं है।</td></tr>')+
 '</tbody></table></div>';
}
function statCards(items){
 return '<div class="stats">'+items.map(x=>
 '<div class="stat"><small>'+escapeHTML(x[0])+'</small><strong>'+escapeHTML(x[1])+'</strong></div>'
 ).join('')+'</div>';
}
function statusOptions(selected){
 return STATUSES.map(s=>'<option value="'+s+'" '+(s===selected?'selected':'')+'>'+s+'</option>').join('');
}

function render(){
 const c=$('content');if(!c)return;

 if(page==='dashboard'){
  const calls=db.activities.filter(a=>a.type==='Call')
   .reduce((n,a)=>n+Number(a.count||1),0);
  const converted=db.customers.filter(x=>x.status==='Converted').length;
  const pending=db.customers.filter(x=>x.followUpDate&&x.followUpDate>=today()&&x.status!=='Converted'&&x.status!=='Lost').length;
  c.innerHTML=statCards([
   ['Total Leads',db.customers.length],
   ['Inventory',db.inventory.length],
   ['Associates',db.associates.length],
   ['Calls Logged',calls],
   ['Converted Leads',converted],
   ['Conversion Rate',db.customers.length?((converted/db.customers.length)*100).toFixed(1)+'%':'0%'],
   ['Upcoming Follow-ups',pending],
   ['Activities',db.activities.length]
  ])+'<div class="panel"><h3>Recent Leads</h3>'+
  tbl(['Name','Phone','Requirement','Status','Follow-up'],
   db.customers.slice().reverse().slice(0,8).map(x=>'<tr><td>'+escapeHTML(x.name)+
   '</td><td>'+escapeHTML(x.phone)+'</td><td>'+escapeHTML(x.requirement)+
   '</td><td>'+escapeHTML(normStatus(x.status))+'</td><td>'+fmtDate(x.followUpDate)+'</td></tr>').join(''))+
  '</div>';
  return;
 }

 if(page==='followups'){
  const list=db.customers.filter(x=>x.followUpDate&&x.status!=='Converted'&&x.status!=='Lost')
   .slice().sort((a,b)=>(a.followUpDate||'').localeCompare(b.followUpDate||''));
  c.innerHTML='<div class="pagehead"><h2>Follow-up Reminders</h2><button onclick="goPage(\'customers\')">Manage Leads</button></div>'+
   '<p class="muted">यह सूची आपके दर्ज किए हुए follow-up date/time पर आधारित है। यह browser notification नहीं भेजती।</p>'+
   tbl(['Customer','Phone','Status','Date','Time','Notes'],list.map(x=>{
    const late=x.followUpDate<today();
    return '<tr><td>'+escapeHTML(x.name)+'</td><td>'+escapeHTML(x.phone)+
    '</td><td>'+escapeHTML(normStatus(x.status))+'</td><td class="'+(late?'overdue':'')+'">'+fmtDate(x.followUpDate)+(late?' · Overdue':'')+
    '</td><td>'+escapeHTML(x.followUpTime||'—')+'</td><td>'+escapeHTML(x.followUpNotes||'')+
    '</td></tr>';
   }).join(''));
  return;
 }

 if(page==='reports'){
  const total=db.customers.length;
  const converted=db.customers.filter(x=>x.status==='Converted').length;
  const lost=db.customers.filter(x=>x.status==='Lost').length;
  const active=db.customers.filter(x=>!['Converted','Lost'].includes(normStatus(x.status))).length;
  const calls=db.activities.filter(x=>x.type==='Call').reduce((n,x)=>n+Number(x.count||1),0);
  c.innerHTML='<h2>Sales Reports</h2>'+statCards([
   ['Total Leads',total],['Active Leads',active],['Converted',converted],['Lost',lost],
   ['Calls Logged',calls],['Conversion Rate',total?((converted/total)*100).toFixed(1)+'%':'0%']
  ])+'<div class="panel"><h3>Lead Status Summary</h3>'+
   tbl(['Status','Count','Share'],STATUSES.map(s=>{
    const n=db.customers.filter(x=>normStatus(x.status)===s).length;
    return '<tr><td>'+s+'</td><td>'+n+'</td><td>'+(total?(n/total*100).toFixed(1):'0.0')+'%</td></tr>';
   }).join(''))+
   '<p class="muted">रिपोर्ट मौजूदा customer status और activities पर आधारित है। केवल दर्ज की गई calls गिनी जाती हैं।</p></div>';
  return;
 }

 if(page==='team'){
  c.innerHTML='<h2>Team Performance</h2><p class="muted">Associate का नाम Activities में दर्ज किए गए नाम से मिलाया जाता है। सही रिपोर्ट के लिए नाम एक जैसा लिखें।</p>'+
  tbl(['Associate','Calls','Activities','Leads Converted'],db.associates.map(a=>{
   const acts=db.activities.filter(x=>(x.associate||'').trim().toLowerCase()===(a.name||'').trim().toLowerCase());
   const callCount=acts.filter(x=>x.type==='Call').reduce((n,x)=>n+Number(x.count||1),0);
   const converted=db.customers.filter(x=>(x.associate||'').trim().toLowerCase()===(a.name||'').trim().toLowerCase()&&x.status==='Converted').length;
   return '<tr><td>'+escapeHTML(a.name)+'</td><td>'+callCount+'</td><td>'+acts.length+'</td><td>'+converted+'</td></tr>';
  }).join(''));
  return;
 }

 if(page==='backup'){
  c.innerHTML='<div class="panel"><h2>Backup & Excel/CSV</h2><div class="actions">'+
   '<button onclick="backup()">Download JSON Backup</button>'+
   '<button class="secondary" onclick="exportAllCSV()">Export all data (CSV)</button></div>'+
   '<p>CSV फ़ाइल Excel में खुलती है। हर module की CSV अलग डाउनलोड करें।</p>'+
   '<div class="field"><label>Import CSV into</label><select id="importKind">'+
   '<option value="customers">Customers & Leads</option><option value="inventory">Inventory</option>'+
   '<option value="associates">Associates</option><option value="activities">Calls & Activities</option></select></div>'+
   '<div class="field"><label>CSV file</label><input id="csvFile" type="file" accept=".csv,text/csv"></div>'+
   '<button onclick="importCSV()">Import CSV</button>'+
   '<p class="muted">Import करने से पहले backup डाउनलोड करें। CSV का पहला row column headers होना चाहिए। Import existing records को delete नहीं करता, नए records जोड़ता है।</p>'+
   '<hr><h3>Follow-up notifications</h3><p class="muted">Notifications तभी आ सकती हैं जब यह वेबसाइट खुली हो और browser permission दी गई हो।</p>'+
   '<button class="secondary" onclick="enableNotifications()">Enable browser notifications</button><span id="notifyState" class="muted"></span></div>';return;
 }

 const titles={customers:'Customers & Leads',inventory:'Plot & Flat Inventory',associates:'Associates & Team',activities:'Calls & Activities'};
 const config={
  customers:[['name','Name'],['phone','Phone'],['location','Location'],['requirement','Requirement'],['budget','Budget'],['status','Status'],['followUpDate','Follow-up Date'],['followUpTime','Follow-up Time']],
  inventory:[['project','Project'],['unit','Plot/Flat No.'],['type','Type'],['size','Size'],['location','Location'],['rate','Sale Rate'],['status','Status']],
  associates:[['name','Name'],['phone','Phone'],['email','Email'],['role','Role']],
  activities:[['date','Date'],['associate','Associate'],['customer','Customer'],['type','Activity'],['count','Call count'],['notes','Notes']]
 };
 const fields=config[page];if(!fields){c.textContent='Page उपलब्ध नहीं है।';return}
 let rows=db[page].map(x=>'<tr>'+fields.map(f=>{
  let val=x[f[0]];
  if(page==='customers'&&f[0]==='status')val=normStatus(val);
  return '<td>'+escapeHTML(val||'—')+'</td>';
 }).join('')+'<td><button class="small secondary" onclick="editRecord(\''+page+'\',\''+escapeHTML(x.id)+'\')">Edit</button> '+
 '<button class="small danger" onclick="del(\''+page+'\',\''+escapeHTML(x.id)+'\')">Delete</button></td></tr>').join('');
 c.innerHTML='<div class="pagehead"><h2>'+titles[page]+'</h2><button onclick="editRecord(\''+page+'\')">+ Add New</button></div>'+
 tbl(fields.map(f=>f[1]).concat(['Action']),rows);
}

function editRecord(kind,id){
 const old=id?db[kind].find(x=>x.id===id)||{}:{};
 const labels={
  customers:[['name','Customer name'],['phone','Phone'],['email','Email'],['location','Location'],['requirement','Requirement'],['budget','Budget'],['status','Lead status'],['associate','Assigned Associate'],['followUpDate','Next follow-up date'],['followUpTime','Follow-up time'],['followUpNotes','Follow-up notes']],
  inventory:[['project','Project'],['unit','Plot/Flat no.'],['type','Type'],['size','Size'],['location','Location'],['rate','Sale rate'],['status','Inventory status']],
  associates:[['name','Name'],['phone','Phone'],['email','Email'],['role','Role']],
  activities:[['date','Date'],['associate','Associate'],['customer','Customer'],['type','Activity type'],['count','Call count'],['notes','Notes']]
 };
 const fields=labels[kind];if(!fields)return;
 const inputs=fields.map(f=>{
  const k=f[0];
  const value=old[k]??(k==='date'?today():k==='count'?1:k==='status'&&kind==='customers'?'New':'');
  let input='';
  if(kind==='customers'&&k==='status'){
   input='<select name="status">'+statusOptions(normStatus(value))+'</select>';
  }else if(k==='followUpDate'){
   input='<input type="date" name="'+k+'" value="'+escapeHTML(value)+'">';
  }else if(k==='followUpTime'){
   input='<input type="time" name="'+k+'" value="'+escapeHTML(value)+'">';
  }else if(k==='followUpNotes'||k==='notes'||k==='requirement'){
   input='<textarea name="'+k+'" rows="2">'+escapeHTML(value)+'</textarea>';
  }else if(kind==='activities'&&k==='type'){
   input='<select name="type">'+['Call','Meeting','Site Visit','WhatsApp','Other'].map(s=>'<option '+(s===value?'selected':'')+'>'+s+'</option>').join('')+'</select>';
  }else{
   input='<input name="'+k+'" value="'+escapeHTML(value)+'" '+(['name','phone','project','unit'].includes(k)?'required':'')+
    (k==='count'?' type="number" min="1"':'')+'>';
  }
  return '<div class="field"><label>'+escapeHTML(f[1])+'</label>'+input+'</div>';
 }).join('');
 $('modal').innerHTML='<div class="modalback" id="modalBack"><div class="modal"><h2>'+(id?'Edit':'Add')+' record</h2><form id="recForm"><div class="grid">'+inputs+'</div><div class="actions"><button type="submit">Save</button><button type="button" class="secondary" id="cancelModal">Cancel</button></div></form></div></div>';
 $('cancelModal').onclick=()=>$('modal').innerHTML='';
 $('modalBack').onclick=e=>{if(e.target===$('modalBack'))$('modal').innerHTML=''};
 $('recForm').onsubmit=async e=>{
  e.preventDefault();
  const values=Object.fromEntries(new FormData(e.target).entries());
  if(kind==='activities')values.count=Number(values.count||1);
  if(kind==='customers'){
   values.status=normStatus(values.status||old.status);
   // पुराने follow-up fields को न मिटाएँ यदि form में कोई field खाली छोड़ी गई हो।
  }
  if(id)Object.assign(old,values);
  else{
   const newId=window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);
   db[kind].push({id:newId,...values});
  }
  $('modal').innerHTML='';
  await save();
 };
}

async function del(kind,id){
 if(!confirm('यह record delete करें?'))return;
 const old=db[kind];db[kind]=old.filter(x=>x.id!==id);
 const ok=await save();if(!ok)db[kind]=old;
}
function backup(){
 try{
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url=window.URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='property-find-backup.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>window.URL.revokeObjectURL(url),1000);
 }catch(e){alert('Backup error: '+e.message)}
}

function csvCell(v){
 const s=String(v??'');
 return '"'+s.replace(/"/g,'""')+'"';
}
function downloadText(filename,text,mime='text/csv;charset=utf-8;'){
 const blob=new Blob(['\\uFEFF',text],{type:mime});
 const url=window.URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>window.URL.revokeObjectURL(url),1200);
}
function exportAllCSV(){
 const keys=['customers','inventory','associates','activities'];
 keys.forEach((kind,i)=>{
  const rows=db[kind]||[];
  const headers=[...new Set(rows.flatMap(x=>Object.keys(x)))];
  if(!headers.length){
   const defaults={customers:['id','name','phone','email','location','requirement','budget','status','associate','followUpDate','followUpTime','followUpNotes'],inventory:['id','project','unit','type','size','location','rate','status'],associates:['id','name','phone','email','role'],activities:['id','date','associate','customer','type','count','notes']}[kind];
   headers.push(...defaults);
  }
  const csv=[headers.map(csvCell).join(','),...rows.map(row=>headers.map(h=>csvCell(row[h])).join(','))].join('\\r\\n');
  downloadText('property-find-'+kind+'.csv',csv);
 });
}
function parseCSV(text){
 const rows=[];let row=[],field='',quoted=false;
 text=text.replace(/^\\uFEFF/,'');
 for(let i=0;i<text.length;i++){
  const ch=text[i],next=text[i+1];
  if(quoted){
   if(ch==='"'&&next==='"'){field+='"';i++}
   else if(ch==='"')quoted=false;
   else field+=ch;
  }else if(ch==='"')quoted=true;
  else if(ch===','){row.push(field);field=''}
  else if(ch==='\\n'){row.push(field);rows.push(row);row=[];field=''}
  else if(ch!=='\\r')field+=ch;
 }
 if(field.length||row.length){row.push(field);rows.push(row)}
 return rows.filter(r=>r.some(x=>x.trim()!==''));
}
async function importCSV(){
 const kind=$('importKind')?.value,file=$('csvFile')?.files?.[0];
 if(!kind||!file){alert('पहले module और CSV file चुनें।');return}
 if(!confirm('CSV से records जोड़ें? Existing data delete नहीं होगा।'))return;
 try{
  const rows=parseCSV(await file.text());
  if(rows.length<2)throw new Error('CSV में header और कम से कम एक data row होना चाहिए।');
  const headers=rows[0].map(x=>x.trim());
  if(!headers.includes('name')&&kind!=='inventory'&&kind!=='activities')throw new Error('CSV headers में name column होना चाहिए।');
  const existing=new Set(db[kind].map(x=>String(x.id||'')));
  const added=[];
  rows.slice(1).forEach(cols=>{
   const obj={};headers.forEach((h,i)=>{if(h)obj[h]=cols[i]??''});
   if(!Object.values(obj).some(v=>String(v).trim()))return;
   if(obj.id&&existing.has(String(obj.id)))delete obj.id;
   if(kind==='customers')obj.status=normStatus(obj.status||'New');
   if(kind==='activities'&&obj.count)obj.count=Number(obj.count)||1;
   obj.id=obj.id||((window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));
   added.push(obj);
  });
  if(!added.length)throw new Error('Import करने के लिए कोई नया record नहीं मिला।');
  db[kind].push(...added);
  if(await save())alert(added.length+' records import हो गए।');
 }catch(err){alert('CSV import failed: '+err.message)}
}
async function enableNotifications(){
 if(!('Notification' in window)){alert('यह browser notifications support नहीं करता।');return}
 try{
  const permission=await Notification.requestPermission();
  if(permission!=='granted'){alert('Browser notification permission allow नहीं हुई।');return}
  $('notifyState').textContent=' Notifications enabled while app is open.';
  checkFollowupNotifications();
  alert('Notifications enabled. Follow-up alerts चलाने के लिए वेबसाइट खुली रखें।');
 }catch(e){alert('Notification error: '+e.message)}
}
const notifiedFollowups=new Set();
function checkFollowupNotifications(){
 if(!('Notification' in window)||Notification.permission!=='granted'||!user)return;
 const now=new Date();
 db.customers.forEach(x=>{
  if(!x.followUpDate||!x.followUpTime||['Converted','Lost'].includes(normStatus(x.status)))return;
  const when=new Date(x.followUpDate+'T'+x.followUpTime);
  const key=String(x.id)+'|'+x.followUpDate+'|'+x.followUpTime;
  if(when<=now&&now-when<24*60*60*1000&&!notifiedFollowups.has(key)){
   new Notification('PROPERTY FIND · Follow-up due',{body:(x.name||'Customer')+' · '+(x.phone||'')+' · '+x.followUpTime});
   notifiedFollowups.add(key);
  }
 });
}
setInterval(checkFollowupNotifications,60000);

init().catch(e=>{setStatus('Startup error');message(e.message,true)});
