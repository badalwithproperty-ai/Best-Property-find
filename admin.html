<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102544"><title>TEAM WORK · Admin Console</title>
<style>
:root{--navy:#102544;--navy2:#19385f;--gold:#c9a65a;--bg:#f3f6fa;--ink:#1e2b3d;--muted:#738096;--line:#e3e9f1;--white:#fff;--green:#16815b;--red:#b83a47}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:var(--navy);color:#fff;font-weight:650}button.secondary{background:#edf1f7;color:var(--navy);border:1px solid var(--line)}button.gold{background:var(--gold);color:#17263d}button.danger{background:#fff0f1;color:var(--red)}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d6deea;border-radius:9px;background:#fff;color:var(--ink)}label{display:block;font-weight:700;font-size:12px;margin:10px 0 5px}.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{background:linear-gradient(180deg,#102544,#0b1c35);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid #ffffff20}.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#e2c77e,#a9853f);display:grid;place-items:center;color:#142640;font-size:20px;font-weight:900}.brand b{font-size:17px;letter-spacing:.7px}.brand small{display:block;color:#c4d1e3;font-size:10px;letter-spacing:1.2px;margin-top:3px}.navlabel{font-size:10px;letter-spacing:1.4px;color:#9eafc8;font-weight:800;padding:0 11px}.nav{display:grid;gap:5px}.nav button{background:transparent;text-align:left;color:#c8d3e3;font-weight:550;padding:11px;border-radius:9px}.nav button:hover,.nav button.active{background:#ffffff16;color:white}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.sidefoot{margin-top:auto;border-top:1px solid #ffffff20;padding:15px 8px;color:#b8c7da;font-size:11px;line-height:1.7}.main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:14px}.crumb{color:var(--muted);font-size:12px}.top strong{display:block;font-size:16px;margin-top:3px}.topright{display:flex;align-items:center;gap:10px}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#e9eef7;color:var(--navy);font-weight:800}.content{padding:25px 28px;max-width:1600px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:19px}.head h1{font-size:25px;margin:0;color:var(--navy);letter-spacing:-.5px}.head p{margin:6px 0 0;color:var(--muted)}.headactions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 14px #18345b08}.stathead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:700}.ico{background:#edf2f9;border-radius:10px;padding:8px;color:var(--navy)}.value{font-size:28px;font-weight:800;color:var(--navy);margin:10px 0 4px}.hint{font-size:11px;color:var(--muted)}.panel h2{font-size:15px;color:var(--navy);margin:0 0 15px}.two{display:grid;grid-template-columns:1.35fr 1fr;gap:15px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}th{background:#f6f8fb;color:#64738a;text-transform:uppercase;letter-spacing:.6px;font-size:10px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbfd}.pill{display:inline-block;border-radius:20px;padding:5px 8px;background:#edf4f0;color:#14764e;font-size:10px;font-weight:800}.pill.warn{background:#fff4dc;color:#956a0a}.pill.red{background:#ffedef;color:#b83a47}.pill.blue{background:#eaf0fc;color:#28549a}.barrow{margin:15px 0}.barlabel{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.bar{height:7px;background:#edf1f6;border-radius:9px;overflow:hidden}.bar span{height:100%;display:block;background:linear-gradient(90deg,#173b68,#c9a65a);border-radius:9px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{background:#f7f9fc;color:var(--navy);border:1px solid var(--line);text-align:left;min-height:70px}.quick button span{display:block;font-size:21px;margin-bottom:7px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.filters input{max-width:320px}.filters select{max-width:210px}.notice{background:#fff8e8;border:1px solid #f0dfb4;border-radius:11px;padding:12px 14px;color:#745a20;font-size:12px;line-height:1.5;margin-bottom:16px}.empty{padding:25px;text-align:center;color:var(--muted)}.modalback{position:fixed;inset:0;background:#07152bb0;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 25px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;color:var(--navy)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;right:20px;background:#102544;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:0 10px 30px #0002;z-index:9}.mobilemenu{display:none}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.content{padding:20px}.top{padding:0 20px}}
@media(max-width:720px){.app{grid-template-columns:1fr}.side{display:none;position:fixed;inset:0 auto 0 0;width:260px;z-index:4;box-shadow:20px 0 60px #0003}.side.open{display:flex}.mobilemenu{display:inline-block}.top{height:64px;padding:0 14px}.content{padding:17px 13px}.head h1{font-size:22px}.stats{gap:9px}.stat{padding:14px}.value{font-size:24px}.quick{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.topright .rolelabel{display:none}}
</style></head>
<body>
<div class="app">
<aside class="side" id="sidebar">
 <div class="brand"><div class="mark">TW</div><div><b>TEAM WORK</b><small>REAL ESTATE CRM</small></div></div>
 <div class="navlabel">WORKSPACE</div><nav class="nav" id="nav">
 <button class="active" data-page="overview">▦ &nbsp; Overview</button><button data-page="projects">⌂ &nbsp; Projects & Inventory</button><button data-page="leads">◎ &nbsp; Leads & Customers</button><button data-page="bookings">▣ &nbsp; Bookings & Payments</button><button data-page="team">♙ &nbsp; Users & Teams</button><button data-page="partners">◇ &nbsp; Channel Partners</button><button data-page="commission">₹ &nbsp; Commission</button><button data-page="attendance">◷ &nbsp; Attendance</button><button data-page="reports">▤ &nbsp; Reports & Targets</button><button data-page="audit">◉ &nbsp; Audit & Settings</button>
 </nav><div class="sidefoot">TEAM WORK Admin Console<br>Secure operations workspace<br><span style="color:#e3c675">●</span> Prototype data stored in this browser</div>
</aside>
<section class="main">
 <header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="secondary mobilemenu" id="mobileMenu">☰</button><div><div class="crumb">TEAM WORK / ADMIN CONSOLE</div><strong id="topTitle">Overview</strong></div></div><div class="topright"><span class="pill blue rolelabel">ADMIN WORKSPACE</span><div class="avatar">AD</div></div></header>
 <main class="content" id="content"></main>
</section>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);
const titles={overview:'Overview',projects:'Projects & Inventory',leads:'Leads & Customers',bookings:'Bookings & Payments',team:'Users & Teams',partners:'Channel Partners',commission:'Commission Management',attendance:'Attendance',reports:'Reports & Targets',audit:'Audit & Settings'};
const key='teamwork_admin_console_v1';
let data;try{data=JSON.parse(localStorage.getItem(key))||null}catch(e){}
if(!data)data={projects:[{id:1,name:'New Project',location:'Add location',plots:0,price:0,status:'Planning'}],leads:[],bookings:[],team:[],partners:[],commission:[],attendance:[],audit:[]};
let page='overview',filter='';
function persist(action,detail){localStorage.setItem(key,JSON.stringify(data));data.audit.unshift({at:new Date().toLocaleString(),action,detail});data.audit=data.audit.slice(0,100);localStorage.setItem(key,JSON.stringify(data));}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pill(s){let c=['Approved','Paid','Completed','Available','Active','Converted'].includes(s)?'':(['Pending','Follow-up','Scheduled','Planning'].includes(s)?'warn':(['Rejected','Overdue','Lost'].includes(s)?'red':'blue'));return '<span class="pill '+c+'">'+escapeHtml(s||'Pending')+'</span>'}
function pageHead(title,desc,button=''){return '<div class="head"><div><h1>'+title+'</h1><p>'+desc+'</p></div><div class="headactions">'+button+'</div></div>'}
function stat(label,val,icon,hint){return '<div class="stat"><div class="stathead">'+label+'<span class="ico">'+icon+'</span></div><div class="value">'+val+'</div><div class="hint">'+hint+'</div></div>'}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+headers.length+'" class="empty">No records yet. Use Add New to create a record.</td></tr>')+'</tbody></table></div>'}
function openModal(title,fields,submitLabel='Save record',initial={}){let form=fields.map(f=>'<div><label>'+f.label+'</label>'+(f.type==='select'?'<select name="'+f.name+'" '+(f.required?'required':'')+'>'+f.options.map(o=>'<option '+(String(initial[f.name]||f.value||'')===String(o.value)?'selected':'')+' value="'+escapeHtml(o.value)+'">'+escapeHtml(o.label)+'</option>').join('')+'</select>':f.type==='textarea'?'<textarea name="'+f.name+'" rows="3" '+(f.required?'required':'')+'>'+escapeHtml(initial[f.name]||'')+'</textarea>':'<input name="'+f.name+'" type="'+(f.type||'text')+'" value="'+escapeHtml(initial[f.name]||'')+'" '+(f.required?'required':'')+' '+(f.min!==undefined?'min="'+f.min+'"':'')+'>')+'</div>').join('');$('#modalRoot').innerHTML='<div class="modalback" id="backdrop"><form class="modal" id="recordForm"><div class="modalhead"><h2>'+title+'</h2><button type="button" class="secondary" id="closeModal">✕</button></div><div class="formgrid">'+form+'</div><div class="modalfoot"><button type="button" class="secondary" id="cancelModal">Cancel</button><button>'+submitLabel+'</button></div></form></div>';$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};return $('#recordForm')}
function closeModal(){$('#modalRoot').innerHTML=''}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2500)}
function addRecord(kind,fields,title){let form=openModal(title,fields);form.onsubmit=e=>{e.preventDefault();let rec=Object.fromEntries(new FormData(form));rec.id=Date.now();data[kind].unshift(rec);persist('Created '+kind,rec.name||rec.customer||rec.plot||rec.person||rec.project||rec.id);closeModal();render();toast('Record saved in this browser')}}
function del(kind,id){if(!confirm('Delete this record?'))return;data[kind]=data[kind].filter(x=>x.id!==id);persist('Deleted '+kind,String(id));render();toast('Record deleted')}
function rowsFor(kind,columns){return data[kind].map(r=>'<tr>'+columns.map(c=>'<td>'+(c==='actions'?'<button class="danger" onclick="del(\''+kind+'\','+r.id+')" style="padding:6px 9px">Delete</button>':c==='status'?pill(r[c]):escapeHtml(r[c]||'—'))+'</td>').join('')+'</tr>')}
function overview(){let pending=data.leads.filter(x=>x.status!=='Converted'&&x.status!=='Lost').length,booked=data.bookings.length,team=data.team.length,commission=data.commission.reduce((n,x)=>n+Number(x.amount||0),0);return pageHead('Business Overview','A live-style command centre for your real estate operations.','<button class="gold" onclick="addLead()">＋ Add Lead</button><button onclick="go(\'projects\')">Manage Inventory</button>')+'<div class="notice"><b>Setup note:</b> This is a separate Admin Console prototype. Records are saved in this browser only; secure shared sync, role enforcement and verified payment integrations require backend configuration.</div><div class="stats">'+stat('OPEN LEADS',pending,'◎','Leads needing action')+stat('BOOKING RECORDS',booked,'▣','All recorded bookings')+stat('TEAM MEMBERS',team,'♙','Users entered in console')+stat('COMMISSION VALUE',money(commission),'₹','Recorded amount, not payout confirmation')+'</div><div class="two"><section class="panel"><h2>Sales Pipeline</h2>'+[['New Leads',data.leads.filter(x=>x.status==='New').length],['Follow-up',data.leads.filter(x=>x.status==='Follow-up').length],['Site Visit',data.leads.filter(x=>x.status==='Site Visit').length],['Converted',data.leads.filter(x=>x.status==='Converted').length]].map(a=>'<div class="barrow"><div class="barlabel"><span>'+a[0]+'</span><b>'+a[1]+'</b></div><div class="bar"><span style="width:'+Math.min(100,a[1]/Math.max(1,data.leads.length)*100)+'%"></span></div></div>').join('')+'</section><section class="panel"><h2>Quick Actions</h2><div class="quick"><button onclick="addLead()"><span>＋</span>Add lead</button><button onclick="addProject()"><span>⌂</span>Add project</button><button onclick="addBooking()"><span>▣</span>New booking</button><button onclick="go(\'team\')"><span>♙</span>Manage team</button><button onclick="go(\'commission\')"><span>₹</span>Commission</button><button onclick="go(\'reports\')"><span>▤</span>Reports</button></div></section></div><section class="panel" style="margin-top:15px"><h2>Recent Leads</h2>'+table(['Customer','Phone','Project','Source','Status'],data.leads.slice(0,6).map(x=>'<tr><td>'+escapeHtml(x.name)+'</td><td>'+escapeHtml(x.phone)+'</td><td>'+escapeHtml(x.project)+'</td><td>'+escapeHtml(x.source)+'</td><td>'+pill(x.status)+'</td></tr>'))+'</section>'}
function addLead(){addRecord('leads',[{name:'name',label:'Customer name',required:true},{name:'phone',label:'Phone',required:true},{name:'project',label:'Project'},{name:'budget',label:'Budget',type:'number',min:0},{name:'source',label:'Lead source',type:'select',options:['Website','Phone Call','Referral','Channel Partner','Walk-in','Advertisement','Excel Import'].map(x=>({label:x,value:x}))},{name:'assigned',label:'Assigned executive'},{name:'status',label:'Status',type:'select',value:'New',options:['New','Follow-up','Site Visit','Negotiation','Converted','Lost'].map(x=>({label:x,value:x}))},{name:'nextFollowup',label:'Next follow-up',type:'datetime-local'},{name:'notes',label:'Notes',type:'textarea'}],'Add customer lead')}
function addProject(){addRecord('projects',[{name:'name',label:'Project name',required:true},{name:'location',label:'Location'},{name:'plots',label:'Total plots',type:'number',min:0},{name:'price',label:'Price per sq yd (₹)',type:'number',min:0},{name:'status',label:'Status',type:'select',value:'Planning',options:['Planning','Active','On Hold','Completed'].map(x=>({label:x,value:x}))}],'Add project')}
function addBooking(){addRecord('bookings',[{name:'customer',label:'Customer name',required:true},{name:'phone',label:'Phone'},{name:'project',label:'Project',required:true},{name:'plot',label:'Plot number',required:true},{name:'area',label:'Area (sq yd)',type:'number',min:0},{name:'amount',label:'Booking amount (₹)',type:'number',min:0},{name:'paymentStatus',label:'Payment verification',type:'select',value:'Pending Verification',options:['Pending Verification','Verified','Rejected'].map(x=>({label:x,value:x}))},{name:'registry',label:'Registry status',type:'select',value:'Pending',options:['Pending','In Process','Completed'].map(x=>({label:x,value:x}))}],'Create booking record')}
function render(){let c=$('#content');$('#topTitle').textContent=titles[page];$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html='';
if(page==='overview')html=overview();
if(page==='projects')html=pageHead('Projects & Inventory','Manage projects, plot availability and pricing.','<button onclick="addProject()">＋ Add Project</button>')+'<div class="stats">'+stat('PROJECTS',data.projects.length,'⌂','Project records')+stat('PLOTS TRACKED',data.projects.reduce((n,x)=>n+Number(x.plots||0),0),'▦','Total plot count entered')+stat('ACTIVE PROJECTS',data.projects.filter(x=>x.status==='Active').length,'✓','Marked active')+stat('LEADS',data.leads.length,'◎','Across all projects')+'</div>'+table(['Project','Location','Plots','Price / sq yd','Status','Action'],rowsFor('projects',['name','location','plots','price','status','actions']));
if(page==='leads')html=pageHead('Leads & Customers','Track source, ownership, follow-up and lead stage.','<button onclick="addLead()">＋ Add Lead</button><button class="secondary" onclick="exportCSV(\'leads\')">Export CSV</button>')+'<div class="filters"><input id="search" placeholder="Search name, phone or project..." value="'+escapeHtml(filter)+'"><select id="stage"><option value="">All stages</option>'+['New','Follow-up','Site Visit','Negotiation','Converted','Lost'].map(x=>'<option>'+x+'</option>').join('')+'</select></div><div id="leadTable"></div>';
if(page==='bookings')html=pageHead('Bookings & Payments','Record booking details, verification and registry progress.','<button onclick="addBooking()">＋ New Booking</button><button class="secondary" onclick="exportCSV(\'bookings\')">Export CSV</button>')+'<div class="notice">A booking or payment is not financially confirmed until verified through authorised reconciliation. This console does not process payments.</div>'+table(['Customer','Phone','Project','Plot','Area','Amount','Verification','Registry','Action'],rowsFor('bookings',['customer','phone','project','plot','area','amount','paymentStatus','registry','actions']));
if(page==='team')html=pageHead('Users & Teams','Prepare Admin, Team Leader and Sales Executive records.','<button onclick="addRecord(\'team\',[{name:\'name\',label:\'Full name\',required:true},{name:\'phone\',label:\'Mobile\'},{name:\'email\',label:\'Email\',type:\'email\'},{name:\'role\',label:\'Role\',type:\'select\',options:[\'Admin\',\'Team Leader\',\'Sales Executive\'].map(x=>({label:x,value:x}))},{name:\'manager\',label:\'Reports to\'},{name:\'status\',label:\'Account status\',type:\'select\',value:\'Pending Approval\',options:[\'Pending Approval\',\'Active\',\'Disabled\'].map(x=>({label:x,value:x}))}],\'Add team member\')">＋ Add User</button>')+'<div class="notice">Creating a record here does not create a secure login or enforce permissions. Authentication and role-based access must be enabled on the backend before production use.</div>'+table(['Name','Mobile','Email','Role','Reports to','Status','Action'],rowsFor('team',['name','phone','email','role','manager','status','actions']));
if(page==='partners')html=pageHead('Channel Partners','Partner directory and referral attribution.','<button onclick="addRecord(\'partners\',[{name:\'name\',label:\'Partner / agency name\',required:true},{name:\'contact\',label:\'Contact person\'},{name:\'phone\',label:\'Mobile\'},{name:\'referralCode\',label:\'Referral code\'},{name:\'level\',label:\'Partner level\',type:\'select\',options:[\'Direct Partner\',\'Sub Partner\',\'Agency\'].map(x=>({label:x,value:x}))},{name:\'status\',label:\'Status\',type:\'select\',value:\'Pending Approval\',options:[\'Pending Approval\',\'Active\',\'Suspended\'].map(x=>({label:x,value:x}))}],\'Register channel partner\')">＋ Add Partner</button>')+table(['Partner','Contact','Mobile','Referral code','Type','Status','Action'],rowsFor('partners',['name','contact','phone','referralCode','level','status','actions']));
if(page==='commission')html=pageHead('Commission Management','Track eligibility, approval and payout records.','<button onclick="addRecord(\'commission\',[{name:\'person\',label:\'Partner / salesperson\',required:true},{name:\'bookingId\',label:\'Booking reference\',required:true},{name:\'basis\',label:\'Commission basis\',type:\'select\',options:[\'Fixed amount\',\'Percentage\',\'Multi-level\'].map(x=>({label:x,value:x}))},{name:\'amount\',label:\'Commission amount (₹)\',type:\'number\',min:0,required:true},{name:\'status\',label:\'Approval / payout status\',type:\'select\',value:\'Pending Approval\',options:[\'Pending Approval\',\'Approved\',\'Payable\',\'Paid\',\'Rejected\'].map(x=>({label:x,value:x}))}],\'Add commission entry\')">＋ Add Entry</button>')+'<div class="notice">Commission shown here is a record only. Approval, eligibility checks and actual payout require authorised verification.</div>'+table(['Partner / Salesperson','Booking ref','Basis','Amount','Status','Action'],rowsFor('commission',['person','bookingId','basis','amount','status','actions']));
if(page==='attendance')html=pageHead('Attendance','Daily check-in / check-out records and visit tracking.','<button onclick="addRecord(\'attendance\',[{name:\'person\',label:\'Employee\',required:true},{name:\'date\',label:\'Date\',type:\'date\',required:true},{name:\'checkin\',label:\'Check-in time\',type:\'time\'},{name:\'checkout\',label:\'Check-out time\',type:\'time\'},{name:\'location\',label:\'Location / site\'},{name:\'status\',label:\'Status\',type:\'select\',options:[\'Present\',\'Late\',\'Half Day\',\'Leave\',\'Site Visit\'].map(x=>({label:x,value:x}))}],\'Record attendance\')">＋ Record Attendance</button>')+'<div class="notice">Location tracking is not enabled here. Production attendance must use clear employee consent and a documented location policy.</div>'+table(['Employee','Date','Check-in','Check-out','Location / Site','Status','Action'],rowsFor('attendance',['person','date','checkin','checkout','location','status','actions']));
if(page==='reports')html=pageHead('Reports & Targets','Export current records and review pipeline progress.','<button onclick="exportAll()">Export all CSVs</button>')+'<div class="stats">'+stat('TOTAL LEADS',data.leads.length,'◎','All lead records')+stat('SITE VISITS',data.leads.filter(x=>x.status==='Site Visit').length,'⌖','Leads at site visit stage')+stat('CONVERTED',data.leads.filter(x=>x.status==='Converted').length,'✓','Converted leads')+stat('BOOKING VALUE',money(data.bookings.reduce((n,x)=>n+Number(x.amount||0),0)),'₹','Recorded booking amounts')+'</div><section class="panel"><h2>Lead conversion overview</h2>'+[['New',data.leads.filter(x=>x.status==='New').length],['Follow-up',data.leads.filter(x=>x.status==='Follow-up').length],['Site Visit',data.leads.filter(x=>x.status==='Site Visit').length],['Negotiation',data.leads.filter(x=>x.status==='Negotiation').length],['Converted',data.leads.filter(x=>x.status==='Converted').length],['Lost',data.leads.filter(x=>x.status==='Lost').length]].map(a=>'<div class="barrow"><div class="barlabel"><span>'+a[0]+'</span><b>'+a[1]+'</b></div><div class="bar"><span style="width:'+Math.min(100,a[1]/Math.max(1,data.leads.length)*100)+'%"></span></div></div>').join('')+'</section>';
if(page==='audit')html=pageHead('Audit & Settings','Review actions recorded in this browser and export a backup.','<button onclick="backup()">Download JSON Backup</button><button class="secondary" onclick="restore()">Import JSON</button>')+'<div class="notice">Audit trail is local to this browser in this prototype. Production audit logs must be server-side, append-only and access-controlled.</div>'+table(['Time','Action','Details'],data.audit.map(x=>'<tr><td>'+escapeHtml(x.at)+'</td><td>'+escapeHtml(x.action)+'</td><td>'+escapeHtml(x.detail)+'</td></tr>'));
c.innerHTML=html;
if(page==='leads'){const draw=()=>{let q=$('#search').value.toLowerCase(),stage=$('#stage').value;let arr=data.leads.filter(x=>(!stage||x.status===stage)&&[x.name,x.phone,x.project,x.source].some(v=>String(v||'').toLowerCase().includes(q)));$('#leadTable').innerHTML=table(['Customer','Phone','Project','Source','Assigned to','Next follow-up','Status','Action'],arr.map(x=>'<tr><td>'+escapeHtml(x.name)+'</td><td>'+escapeHtml(x.phone)+'</td><td>'+escapeHtml(x.project)+'</td><td>'+escapeHtml(x.source)+'</td><td>'+escapeHtml(x.assigned)+'</td><td>'+escapeHtml(x.nextFollowup)+'</td><td>'+pill(x.status)+'</td><td><button class="danger" style="padding:6px 9px" onclick="del(\'leads\','+x.id+')">Delete</button></td></tr>'))};$('#search').oninput=draw;$('#stage').onchange=draw;draw()}
}
function go(p){page=p;filter='';render();$('#sidebar').classList.remove('open')}
function exportCSV(kind){let arr=data[kind]||[];if(!arr.length){toast('No records to export');return}let keys=[...new Set(arr.flatMap(x=>Object.keys(x)))];let csv=[keys.join(','),...arr.map(x=>keys.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');download(csv,'team-work-'+kind+'.csv','text/csv');}
function download(text,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportAll(){Object.keys(data).filter(k=>Array.isArray(data[k])&&data[k].length).forEach(exportCSV)}
function backup(){download(JSON.stringify(data,null,2),'team-work-admin-backup.json','application/json')}
function restore(){let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{let v=JSON.parse(await i.files[0].text());if(!v||!Array.isArray(v.leads)||!Array.isArray(v.projects))throw Error('Invalid backup');data={...data,...v};persist('Imported backup','JSON backup');render();toast('Backup imported')}catch(e){alert('Could not import: '+e.message)}};i.click()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');
render();
</script></body></html>
