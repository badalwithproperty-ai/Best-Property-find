<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102544"><title>TEAM WORK · Admin Console</title>
<style>
:root{--navy:#102544;--navy2:#19385f;--gold:#c9a65a;--bg:#f3f6fa;--ink:#1e2b3d;--muted:#738096;--line:#e3e9f1;--white:#fff;--green:#16815b;--red:#b83a47}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:var(--navy);color:#fff;font-weight:650}button.secondary{background:#edf1f7;color:var(--navy);border:1px solid var(--line)}button.gold{background:var(--gold);color:#17263d}button.danger{background:#fff0f1;color:var(--red)}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d6deea;border-radius:9px;background:#fff;color:var(--ink)}label{display:block;font-weight:700;font-size:12px;margin:10px 0 5px}.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{background:linear-gradient(180deg,#102544,#0b1c35);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid #ffffff20}.mark{width:52px;height:52px;flex:0 0 52px;border-radius:13px;object-fit:cover;display:block;box-shadow:0 4px 14px #0005;border:1px solid #d8b85e}.brand b{font-size:17px;letter-spacing:.7px}.brand small{display:block;color:#c4d1e3;font-size:10px;letter-spacing:1.2px;margin-top:3px}.navlabel{font-size:10px;letter-spacing:1.4px;color:#9eafc8;font-weight:800;padding:0 11px}.nav{display:grid;gap:5px}.nav button{background:transparent;text-align:left;color:#c8d3e3;font-weight:550;padding:11px;border-radius:9px}.nav button:hover,.nav button.active{background:#ffffff16;color:white}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.sidefoot{margin-top:auto;border-top:1px solid #ffffff20;padding:15px 8px;color:#b8c7da;font-size:11px;line-height:1.7}.main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:14px}.crumb{color:var(--muted);font-size:12px}.top strong{display:block;font-size:16px;margin-top:3px}.topright{display:flex;align-items:center;gap:10px}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#e9eef7;color:var(--navy);font-weight:800}.content{padding:25px 28px;max-width:1600px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:19px}.head h1{font-size:25px;margin:0;color:var(--navy);letter-spacing:-.5px}.head p{margin:6px 0 0;color:var(--muted)}.headactions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 14px #18345b08}.stathead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:700}.ico{background:#edf2f9;border-radius:10px;padding:8px;color:var(--navy)}.value{font-size:28px;font-weight:800;color:var(--navy);margin:10px 0 4px}.hint{font-size:11px;color:var(--muted)}.panel h2{font-size:15px;color:var(--navy);margin:0 0 15px}.two{display:grid;grid-template-columns:1.35fr 1fr;gap:15px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}th{background:#f6f8fb;color:#64738a;text-transform:uppercase;letter-spacing:.6px;font-size:10px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbfd}.pill{display:inline-block;border-radius:20px;padding:5px 8px;background:#edf4f0;color:#14764e;font-size:10px;font-weight:800}.pill.warn{background:#fff4dc;color:#956a0a}.pill.red{background:#ffedef;color:#b83a47}.pill.blue{background:#eaf0fc;color:#28549a}.barrow{margin:15px 0}.barlabel{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.bar{height:7px;background:#edf1f6;border-radius:9px;overflow:hidden}.bar span{height:100%;display:block;background:linear-gradient(90deg,#173b68,#c9a65a);border-radius:9px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{background:#f7f9fc;color:var(--navy);border:1px solid var(--line);text-align:left;min-height:70px}.quick button span{display:block;font-size:21px;margin-bottom:7px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.filters input{max-width:320px}.filters select{max-width:210px}.notice{background:#fff8e8;border:1px solid #f0dfb4;border-radius:11px;padding:12px 14px;color:#745a20;font-size:12px;line-height:1.5;margin-bottom:16px}.empty{padding:25px;text-align:center;color:var(--muted)}.modalback{position:fixed;inset:0;background:#07152bb0;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 25px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;color:var(--navy)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;right:20px;background:#102544;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:0 10px 30px #0002;z-index:9}.mobilemenu{display:none}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.content{padding:20px}.top{padding:0 20px}}
@media(max-width:720px){.app{grid-template-columns:1fr}.side{display:none;position:fixed;inset:0 auto 0 0;width:260px;z-index:4;box-shadow:20px 0 60px #0003}.side.open{display:flex}.mobilemenu{display:inline-block}.top{height:64px;padding:0 14px}.content{padding:17px 13px}.head h1{font-size:22px}.stats{gap:9px}.stat{padding:14px}.value{font-size:24px}.quick{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.topright .rolelabel{display:none}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
<aside class="side" id="sidebar">
 <div class="brand"><img class="mark" src="./assets/team-work-real-estate-crm.svg" alt="TEAM WORK Real Estate CRM logo"><div><b>TEAM WORK</b><small>REAL ESTATE CRM</small></div></div>
 <div class="navlabel">WORKSPACE</div><nav class="nav" id="nav">
 <button class="active" data-page="overview">▦ &nbsp; Overview</button><button data-page="projects">⌂ &nbsp; Projects & Inventory</button><button data-page="leads">◎ &nbsp; Leads & Customers</button><button data-page="bookings">▣ &nbsp; Bookings & Payments</button><button data-page="team">♙ &nbsp; Users & Teams</button><button data-page="partners">◇ &nbsp; Channel Partners</button><button data-page="commission">₹ &nbsp; Commission</button><button data-page="attendance">◷ &nbsp; Attendance</button><button data-page="reports">▤ &nbsp; Reports & Targets</button><button data-page="audit">◉ &nbsp; Audit & Settings</button>
 </nav><div class="sidefoot">TEAM WORK Admin Console<br>Secure operations workspace<br><span style="color:#e3c675">●</span> Cloud-synced Admin Console</div>
</aside>
<section class="main">
 <header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="secondary mobilemenu" id="mobileMenu">☰</button><div><div class="crumb">TEAM WORK / ADMIN CONSOLE</div><strong id="topTitle">Overview</strong></div></div><div class="topright"><span class="pill blue rolelabel">ADMIN WORKSPACE</span><div class="avatar">AD</div></div></header>
 <main class="content" id="content"></main>
</section>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);
const titles={overview:'Overview',projects:'Projects & Inventory',leads:'Leads & Customers',bookings:'Bookings & Payments',team:'Users & Teams',partners:'Channel Partners',commission:'Commission Management',attendance:'Attendance',reports:'Reports & Targets',audit:'Audit & Settings'};
const key='teamwork_admin_console_v1';
const emptyAdminData=()=>({projects:[{id:1,name:'New Project',location:'Add location',plots:0,price:0,status:'Planning'}],leads:[],bookings:[],team:[],partners:[],commission:[],attendance:[],audit:[]});
let data;try{data=JSON.parse(localStorage.getItem(key))||null}catch(e){}
if(!data)data=emptyAdminData();
let crmLive={inventory:[],leads:[],associates:[],activities:[],projects:[],tasks:[],attendance:[],members:[],updatedAt:null};
let page='overview',filter='',adminAuthorized=false,adminOwnerId=null,adminSaveQueue=Promise.resolve(),cloudAdminReady=false,crmRefreshTimer=null;
function persist(action,detail){
 data.audit.unshift({at:new Date().toLocaleString(),action,detail});data.audit=data.audit.slice(0,100);
 localStorage.setItem(key,JSON.stringify(data));
 if(cloudAdminReady){
  adminSaveQueue=adminSaveQueue.then(()=>saveAdminConsoleToCloud()).catch(err=>{console.error(err);toast('Cloud save failed. Please refresh and retry.');});
 }
}
async function saveAdminConsoleToCloud(){
 if(!adminSupabase||!adminOwnerId||!adminAuthorized)return;
 const {data:row,error:readError}=await adminSupabase.from('workspace_state').select('data').eq('owner_id',adminOwnerId).maybeSingle();
 if(readError)throw readError;
 const merged={...(row?.data||{}),adminConsole:data};
 const {error}=await adminSupabase.from('workspace_state').upsert({owner_id:adminOwnerId,data:merged,updated_at:new Date().toISOString()},{onConflict:'owner_id'});
 if(error)throw error;
}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pill(s){let c=['Approved','Paid','Completed','Available','Active','Converted'].includes(s)?'':(['Pending','Follow-up','Scheduled','Planning'].includes(s)?'warn':(['Rejected','Overdue','Lost'].includes(s)?'red':'blue'));return '<span class="pill '+c+'">'+escapeHtml(s||'Pending')+'</span>'}
function pageHead(title,desc,button=''){return '<div class="head"><div><h1>'+title+'</h1><p>'+desc+'</p></div><div class="headactions">'+button+'</div></div>'}
function stat(label,val,icon,hint){return '<div class="stat"><div class="stathead">'+label+'<span class="ico">'+icon+'</span></div><div class="value">'+val+'</div><div class="hint">'+hint+'</div></div>'}
function table(headers,rows){const body=Array.isArray(rows)?rows.join(''):String(rows||'');return '<div class="tablewrap"><table><thead><tr>'+headers.map(x=>'<th>'+escapeHtml(x)+'</th>').join('')+'</tr></thead><tbody>'+(body.trim()?body:'<tr><td colspan="'+headers.length+'" class="empty">No records yet. Use Add New to create a record.</td></tr>')+'</tbody></table></div>'}
function openModal(title,fields,submitLabel='Save record',initial={}){let form=fields.map(f=>'<div><label>'+f.label+'</label>'+(f.type==='select'?'<select name="'+f.name+'" '+(f.required?'required':'')+'>'+f.options.map(o=>'<option '+(String(initial[f.name]||f.value||'')===String(o.value)?'selected':'')+' value="'+escapeHtml(o.value)+'">'+escapeHtml(o.label)+'</option>').join('')+'</select>':f.type==='textarea'?'<textarea name="'+f.name+'" rows="3" '+(f.required?'required':'')+'>'+escapeHtml(initial[f.name]||'')+'</textarea>':'<input name="'+f.name+'" type="'+(f.type||'text')+'" value="'+escapeHtml(initial[f.name]||'')+'" '+(f.required?'required':'')+' '+(f.min!==undefined?'min="'+f.min+'"':'')+'>')+'</div>').join('');$('#modalRoot').innerHTML='<div class="modalback" id="backdrop"><form class="modal" id="recordForm"><div class="modalhead"><h2>'+title+'</h2><button type="button" class="secondary" id="closeModal">✕</button></div><div class="formgrid">'+form+'</div><div class="modalfoot"><button type="button" class="secondary" id="cancelModal">Cancel</button><button>'+submitLabel+'</button></div></form></div>';$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};return $('#recordForm')}
function closeModal(){$('#modalRoot').innerHTML=''}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2500)}
function addRecord(kind,fields,title){let form=openModal(title,fields);form.onsubmit=e=>{e.preventDefault();let rec=Object.fromEntries(new FormData(form));rec.id=Date.now();data[kind].unshift(rec);persist('Created '+kind,rec.name||rec.customer||rec.plot||rec.person||rec.project||rec.id);closeModal();render();toast('Record saved in this browser')}}
function del(kind,id){if(!confirm('Delete this record?'))return;data[kind]=data[kind].filter(x=>x.id!==id);persist('Deleted '+kind,String(id));render();toast('Record deleted')}
function rowsFor(kind,columns){return data[kind].map(r=>'<tr>'+columns.map(c=>'<td>'+(c==='actions'?'<button class="danger" onclick="del(\''+kind+'\','+r.id+')" style="padding:6px 9px">Delete</button>':c==='status'?pill(r[c]):escapeHtml(r[c]||'—'))+'</td>').join('')+'</tr>')}
function crmLiveSection(){
 const inv=crmLive.inventory||[],leads=crmLive.leads||[],associates=crmLive.associates||[],acts=crmLive.activities||[],att=crmLive.attendance||[],members=crmLive.members||[];
 const inventoryRows=inv.slice(0,8).map(x=>'<tr><td>'+escapeHtml(x.plotNo||x.plot_or_flat_no||x.name||'—')+'</td><td>'+escapeHtml(x.project||x.project_name||x.property_name||'—')+'</td><td>'+escapeHtml(x.size||x.area||'—')+'</td><td>'+escapeHtml(x.rate||x.basic_rate||x.sale_rate||'—')+'</td><td>'+pill(x.status||'—')+'</td></tr>').join('');
 const leadRows=leads.slice(0,8).map(x=>'<tr><td>'+escapeHtml(x.name||x.full_name||'—')+'</td><td>'+escapeHtml(x.phone||'—')+'</td><td>'+escapeHtml(x.project||x.requirement||'—')+'</td><td>'+pill(x.status||'New')+'</td></tr>').join('');
 const associateRows=associates.slice(0,6).map(x=>'<tr><td>'+escapeHtml(x.name||x.full_name||'—')+'</td><td>'+escapeHtml(x.phone||'—')+'</td><td>'+escapeHtml(x.role||x.designation||'Associate')+'</td></tr>').join('');
 const activityRows=acts.slice(0,6).map(x=>'<tr><td>'+escapeHtml(x.date||x.created_at||'—')+'</td><td>'+escapeHtml(x.associate||x.employee||'—')+'</td><td>'+escapeHtml(x.customer||'—')+'</td><td>'+escapeHtml(x.type||'Activity')+'</td><td>'+escapeHtml(x.notes||x.count||'—')+'</td></tr>').join('');
 const attendanceRows=att.slice(0,6).map(x=>'<tr><td>'+escapeHtml(x.employee||x.person||x.name||'—')+'</td><td>'+escapeHtml(x.date||'—')+'</td><td>'+escapeHtml(x.checkIn||x.checkin||'—')+'</td><td>'+escapeHtml(x.checkOut||x.checkout||'—')+'</td><td>'+escapeHtml(x.site||x.location||'—')+'</td></tr>').join('');
 const projectRows=(crmLive.projects||[]).slice(0,6).map(x=>'<tr><td>'+escapeHtml(x.name||x.project||'—')+'</td><td>'+escapeHtml(x.location||'—')+'</td><td>'+escapeHtml(x.status||'—')+'</td></tr>').join('');
 const taskRows=(crmLive.tasks||[]).slice(0,6).map(x=>'<tr><td>'+escapeHtml(x.title||x.name||x.task||'—')+'</td><td>'+escapeHtml(x.assignee||x.assignedTo||'—')+'</td><td>'+escapeHtml(x.dueDate||x.due_date||'—')+'</td><td>'+pill(x.status||'Pending')+'</td></tr>').join('');
 return '<section class="panel" style="margin-top:16px"><div class="pagehead"><div><h2>CRM Live Sync</h2><p class="muted">CRM में सेव हुआ डेटा यहाँ अपने-आप refresh होता है। आखिरी sync: '+escapeHtml(crmLive.updatedAt||'Loading…')+'</p></div><button class="secondary" onclick="refreshCrmLiveData().then(()=>{render();toast(\'CRM data refreshed\')}).catch(e=>toast(\'Sync failed: \'+e.message))">↻ Refresh Now</button></div><div class="stats">'+stat('CRM LEADS',leads.length,'◎','CRM से synced')+stat('PLOT / FLAT INVENTORY',inv.length,'▦','CRM inventory')+stat('ASSOCIATES',associates.length,'♙','CRM team records')+stat('ACTIVITIES',acts.length,'✓','Calls and follow-ups')+'</div><div class="two"><section class="panel"><h3>Latest CRM Inventory</h3>'+table(['Plot / Flat','Project','Size','Rate','Status'],inventoryRows)+'</section><section class="panel"><h3>Latest CRM Leads</h3>'+table(['Customer','Mobile','Requirement','Status'],leadRows)+'</section><section class="panel"><h3>CRM Associates</h3>'+table(['Name','Mobile','Role'],associateRows)+'</section><section class="panel"><h3>CRM Activities</h3>'+table(['Date','Associate','Customer','Type','Notes / Count'],activityRows)+'</section></div><div class="two"><section class="panel"><h3>CRM Projects</h3>'+table(['Project','Location','Status'],projectRows)+'</section><section class="panel"><h3>CRM Tasks</h3>'+table(['Task','Assigned To','Due Date','Status'],taskRows)+'</section></div><h3>CRM Attendance</h3>'+table(['Employee','Date','Check-in','Check-out','Office / Site'],attendanceRows)+'<h3>Registered Members</h3>'+table(['Name','Mobile','Referral ID','Designation','Approval'],members.slice(0,10).map(m=>'<tr><td>'+escapeHtml(m.full_name||'—')+'</td><td>'+escapeHtml(m.phone||'—')+'</td><td>'+escapeHtml(m.referral_id||'—')+'</td><td>'+escapeHtml(m.designation||'—')+'</td><td>'+pill(m.approval_status||'—')+'</td></tr>').join(''))+'</section>';
}
async function refreshCrmLiveData(){
 if(!adminSupabase||!adminOwnerId||!adminAuthorized)return;
 const [stateRes,leadRes,memberRes]=await Promise.all([
  adminSupabase.from('workspace_state').select('data,updated_at').eq('owner_id',adminOwnerId).maybeSingle(),
  adminSupabase.from('team_leads').select('id,lead_data,created_at,updated_at').eq('workspace_owner_id',adminOwnerId).order('updated_at',{ascending:false}).limit(500),
  adminSupabase.from('member_profiles').select('full_name,phone,referral_id,designation,approval_status,created_at').eq('workspace_owner_id',adminOwnerId).order('created_at',{ascending:false}).limit(500)
 ]);
 if(stateRes.error)throw stateRes.error;
 if(leadRes.error)throw leadRes.error;
 if(memberRes.error)throw memberRes.error;
 const d=stateRes.data?.data||{};
 crmLive={
  inventory:Array.isArray(d.inventory)?d.inventory:[],
  leads:(leadRes.data||[]).map(r=>({...((r.lead_data&&typeof r.lead_data==='object')?r.lead_data:{}),id:r.id,created_at:r.created_at,updated_at:r.updated_at})),
  associates:Array.isArray(d.associates)?d.associates:[],
  activities:Array.isArray(d.activities)?d.activities:[],
  projects:Array.isArray(d.projects)?d.projects:[],
  tasks:Array.isArray(d.tasks)?d.tasks:[],
  attendance:Array.isArray(d.attendance)?d.attendance:[],
  members:memberRes.data||[],
  updatedAt:new Date().toLocaleString('en-IN')
 };
 if(page==='overview'&&document.visibilityState!=='hidden')render();
}
function overview(){let pending=data.leads.filter(x=>x.status!=='Converted'&&x.status!=='Lost').length,booked=data.bookings.length,team=data.team.length,commission=data.commission.reduce((n,x)=>n+Number(x.amount||0),0);return pageHead('Business Overview','A live-style command centre for your real estate operations.','<button class="gold" onclick="addLead()">＋ Add Lead</button><button onclick="go(\'projects\')">Manage Inventory</button>')+'<div class="notice"><b>Cloud sync:</b> Admin Console records are saved in the Main Admin workspace in Supabase. CRM records below are fetched from the same workspace; they are refreshed every 30 seconds. Lead and booking records are operational tracking entries; they do not confirm payments or legal transactions.</div><div class="stats">'+stat('OPEN LEADS',pending,'◎','Admin Console leads')+stat('BOOKING RECORDS',booked,'▣','Admin Console bookings')+stat('TEAM MEMBERS',team,'♙','Users entered in console')+stat('COMMISSION VALUE',money(commission),'₹','Recorded amount, not payout confirmation')+'</div><div class="two"><section class="panel"><h2>Sales Pipeline</h2>'+[['New Leads',data.leads.filter(x=>x.status==='New').length],['Follow-up',data.leads.filter(x=>x.status==='Follow-up').length],['Site Visit',data.leads.filter(x=>x.status==='Site Visit').length],['Converted',data.leads.filter(x=>x.status==='Converted').length]].map(a=>'<div class="barrow"><div class="barlabel"><span>'+a[0]+'</span><b>'+a[1]+'</b></div><div class="bar"><span style="width:'+Math.min(100,a[1]/Math.max(1,data.leads.length)*100)+'%"></span></div></div>').join('')+'</section><section class="panel"><h2>Quick Actions</h2><div class="quick"><button onclick="addLead()"><span>＋</span>Add lead</button><button onclick="addProject()"><span>⌂</span>Add project</button><button onclick="addBooking()"><span>▣</span>New booking</button><button onclick="go(\'team\')"><span>♙</span>Manage team</button><button onclick="go(\'commission\')"><span>₹</span>Commission</button><button onclick="go(\'reports\')"><span>▤</span>Reports</button></div></section></div><section class="panel" style="margin-top:15px"><h2>Recent Admin Console Leads</h2>'+table(['Customer','Phone','Project','Source','Status'],data.leads.slice(0,6).map(x=>'<tr><td>'+escapeHtml(x.name)+'</td><td>'+escapeHtml(x.phone)+'</td><td>'+escapeHtml(x.project)+'</td><td>'+escapeHtml(x.source)+'</td><td>'+pill(x.status)+'</td></tr>'))+'</section>'+crmLiveSection()}

async function callReferralAdminAction(action,userId){
 const {data:sessionData,error:sessionError}=await adminSupabase.auth.getSession();
 if(sessionError)throw sessionError;
 const session=sessionData.session;if(!session)throw new Error('पहले मुख्य ऐप में लॉगिन करें।');
 const response=await fetch(ADMIN_SUPABASE_URL+'/functions/v1/referral-auth',{
  method:'POST',
  headers:{'Content-Type':'application/json','apikey':ADMIN_SUPABASE_KEY,'Authorization':'Bearer '+session.access_token},
  body:JSON.stringify({action,user_id:userId})
 });
 const result=await response.json().catch(()=>({error:'Server response पढ़ा नहीं जा सका।'}));
 if(!response.ok)throw new Error(result.error||'Action failed ('+response.status+')');
 return result;
}
async function changeMemberStatus(userId,status){
 const action=status==='approved'?'approve':'reject';
 const label=action==='approve'?'Approve':'Reject';
 if(!confirm(label+' this member?'))return;
 try{
  await callReferralAdminAction(action,userId);
  await loadRegisteredMembers();
  alert(action==='approve'?'Member approved. अब member दोबारा लॉगिन करके workspace इस्तेमाल कर सकता है.':'Member rejected. Workspace access revoke कर दिया गया है.');
 }catch(err){alert(label+' नहीं हुआ: '+(err.message||String(err)));}
}
async function removeMemberProfile(userId,fullName){
 if(!confirm('क्या '+fullName+' का profile और login account स्थायी रूप से हटाना है? यह कार्रवाई वापस नहीं हो सकती। अगर इस member ने referrals बनाए हैं, तो पहले उन्हें reassign करना होगा.'))return;
 try{
  await callReferralAdminAction('remove',userId);
  await loadRegisteredMembers();

 }catch(err){alert('Remove नहीं हुआ: '+(err.message||String(err)));}
}

async function initializeAdminConsole(){
 try{
  if(!window.supabase||!window.supabase.createClient)throw new Error('Supabase library load नहीं हुई।');
  if(!adminSupabase)adminSupabase=window.supabase.createClient(ADMIN_SUPABASE_URL,ADMIN_SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data:sessionData,error:sessionError}=await adminSupabase.auth.getSession();
  if(sessionError)throw sessionError;
  const session=sessionData.session;
  if(!session){adminAuthorized=false;render();return;}
  const {data:profile,error:profileError}=await adminSupabase.from('member_profiles').select('user_id,workspace_owner_id').eq('user_id',session.user.id).maybeSingle();
  if(profileError)throw profileError;
  if(!profile||profile.workspace_owner_id!==session.user.id){adminAuthorized=false;render();return;}
  adminOwnerId=session.user.id;adminAuthorized=true;
  const {data:row,error:rowError}=await adminSupabase.from('workspace_state').select('data').eq('owner_id',adminOwnerId).maybeSingle();
  if(rowError)throw rowError;
  if(row?.data?.adminConsole&&typeof row.data.adminConsole==='object'){
   data={...emptyAdminData(),...row.data.adminConsole};
  }else{
   await saveAdminConsoleToCloud();
  }
  localStorage.setItem(key,JSON.stringify(data));cloudAdminReady=true;
  $('#topTitle').textContent='Admin Console · Cloud Synced';
  await refreshCrmLiveData();
  if(!crmRefreshTimer)crmRefreshTimer=setInterval(()=>{if(adminAuthorized)refreshCrmLiveData().catch(err=>console.warn('CRM live refresh failed',err));},30000);
  render();
 }catch(err){
  adminAuthorized=false;
  const c=$('#content');c.innerHTML='<div class="notice">Admin Console connect नहीं हो पाया: '+escapeHtml(err.message||String(err))+'। मुख्य ऐप में लॉगिन करके फिर कोशिश करें।</div>';
 }
}

function go(p){page=p;filter='';render();$('#sidebar').classList.remove('open')}
function exportCSV(kind){let arr=data[kind]||[];if(!arr.length){toast('No records to export');return}let keys=[...new Set(arr.flatMap(x=>Object.keys(x)))];let csv=[keys.join(','),...arr.map(x=>keys.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');download(csv,'team-work-'+kind+'.csv','text/csv');}
function download(text,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportAll(){Object.keys(data).filter(k=>Array.isArray(data[k])&&data[k].length).forEach(exportCSV)}
function backup(){download(JSON.stringify(data,null,2),'team-work-admin-backup.json','application/json')}
function restore(){let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{let v=JSON.parse(await i.files[0].text());if(!v||!Array.isArray(v.leads)||!Array.isArray(v.projects))throw Error('Invalid backup');data={...data,...v};persist('Imported backup','JSON backup');render();toast('Backup imported')}catch(e){alert('Could not import: '+e.message)}};i.click()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');
initializeAdminConsole();
</script></body></html>
