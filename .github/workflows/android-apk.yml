name: Build Android APK
on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon -p android-app assembleDebug
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.0
          name: Best Property Find Android App v1.0.0
          body: Installable Android APK for Best Property Find.
          make_latest: true
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
