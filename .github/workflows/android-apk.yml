name: Build TEAM WORK Admin Android App
on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Admin APK
        run: gradle --no-daemon -p android-app assembleDebug
      - name: Validate APK package
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 500000 ]; then
            echo "::error::APK is unexpectedly small ($SIZE bytes); refusing to publish."
            exit 1
          fi
          unzip -t "$APK"
          unzip -l "$APK" | grep -E 'classes.dex|AndroidManifest.xml'
      - name: Publish Admin APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: team-work-admin-v1.0.1
          name: TEAM WORK Admin Android App v1.0.1
          body: TEAM WORK Admin Android app. APK validated for package contents before publishing.
          make_latest: false
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
