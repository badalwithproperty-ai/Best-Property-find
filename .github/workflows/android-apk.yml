name: Build TEAM WORK Admin Android App
on:
  push:
    paths:
      - 'android-app/**'
      - 'assets/team-work-real-estate-crm.svg'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Generate launcher icons from TEAM WORK logo
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user cairosvg
          python3 - <<'PY'
          import os
          import cairosvg
          source = 'assets/team-work-real-estate-crm.svg'
          densities = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for folder, size in densities.items():
              out_dir = f'android-app/app/src/main/res/{folder}'
              os.makedirs(out_dir, exist_ok=True)
              cairosvg.svg2png(url=source, write_to=f'{out_dir}/ic_launcher.png', output_width=size, output_height=size)
              cairosvg.svg2png(url=source, write_to=f'{out_dir}/ic_launcher_round.png', output_width=size, output_height=size)
              print(f'Generated {folder} launcher icons: {size}x{size}')
          PY
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Admin APK
        shell: bash
        run: |
          set -euo pipefail
          rm -f android-app/app/build/outputs/apk/debug/app-debug.apk
          gradle --no-daemon -p android-app clean assembleDebug
      - name: Validate APK package and launcher icon
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          unzip -t "$APK"
          unzip -l "$APK" | tee /tmp/apk-list.txt
          grep -Eq 'classes[0-9]*\.dex' /tmp/apk-list.txt
          grep -q 'AndroidManifest.xml' /tmp/apk-list.txt
          grep -q 'ic_launcher.png' /tmp/apk-list.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.teamwork.crm.admin'" /tmp/apk-badging.txt
          grep -q "application: label='TEAM WORK Admin'" /tmp/apk-badging.txt
      - name: Publish Admin APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: team-work-admin-v1.0.4
          name: TEAM WORK Admin Android App v1.0.4
          body: TEAM WORK Admin Android app v1.0.4. Updated to load the latest TEAM WORK CRM Admin Panel; APK package, DEX, manifest, and launcher icon are validated before publishing.
          make_latest: false
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
